name: Windows workbench preview

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/windows-solidfreecad-workbench-v1"
      - "product/**"
    paths:
      - ".github/workflows/windows-workbench-preview.yml"
      - "overlay/**"
      - "tests/**"
      - "scripts/preview-windows/**"
      - "scripts/windows/Install-SolidFreeCAD-Overlay.ps1"
  pull_request:
    paths:
      - ".github/workflows/windows-workbench-preview.yml"
      - "overlay/**"
      - "tests/**"
      - "scripts/preview-windows/**"
      - "scripts/windows/Install-SolidFreeCAD-Overlay.ps1"

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-workbench-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_RUN_ID: "30191309655"
  BASELINE_ARTIFACT: "SolidFreeCAD-0.1.0-alpha.1-Windows-x64-Portable-Baseline"
  FREECAD_TAG: "1.1.1"
  FREECAD_COMMIT: "0108fd4b4850cc46e625b60e53cea7a7bbe69f8d"
  SOLIDFREECAD_VERSION: "0.1.0-alpha.2"

jobs:
  package-workbench-preview:
    name: Test and package SolidFreeCAD workbench preview
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout SolidFreeCAD Desktop
        uses: actions/checkout@v4

      - name: Download validated Windows baseline
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          path: baseline-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: Validate PowerShell and Python sources
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/windows/Install-SolidFreeCAD-Overlay.ps1",
            "scripts/preview-windows/Package-Workbench-Preview.ps1"
          )

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax validation failed: $script"
            }
          }

          $pythonFiles = Get-ChildItem -Path "overlay", "tests" -Filter "*.py" -Recurse
          foreach ($pythonFile in $pythonFiles) {
            python -m py_compile $pythonFile.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Python syntax validation failed: $($pythonFile.FullName)"
            }
          }

      - name: Expand validated baseline runtime
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath "baseline-artifact" -Filter "*.7z" -File |
            Select-Object -First 1

          if (-not $archive) {
            throw "The baseline artifact does not contain a .7z runtime."
          }

          $sourceRoot = Join-Path $env:RUNNER_TEMP "FreeCAD-source"
          $runtimeRoot = Join-Path $sourceRoot ".pixi/envs/default"
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null

          & 7z x $archive.FullName "-o$runtimeRoot" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to extract the validated baseline runtime."
          }

          $command = Join-Path $runtimeRoot "Library/bin/FreeCADCmd.exe"
          if (-not (Test-Path -LiteralPath $command)) {
            throw "Extracted baseline is missing FreeCADCmd.exe: $command"
          }

          "FREECAD_SOURCE=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FREECAD_RUNTIME=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install shared SolidFreeCAD overlay
        shell: pwsh
        run: |
          ./scripts/windows/Install-SolidFreeCAD-Overlay.ps1 `
            -SourceDirectory $env:FREECAD_SOURCE `
            -OverlayDirectory "overlay" `
            -Force

      - name: Run parametric shaft smoke test
        shell: pwsh
        run: |
          $command = Join-Path $env:FREECAD_RUNTIME "Library/bin/FreeCADCmd.exe"
          $previousPath = $env:PATH
          $previousPythonHome = $env:PYTHONHOME
          $example = Join-Path $env:RUNNER_TEMP "Eje-Parametrico-Demo.FCStd"

          try {
            $env:PATH = "$(Join-Path $env:FREECAD_RUNTIME 'Library/bin');$env:FREECAD_RUNTIME;$(Join-Path $env:FREECAD_RUNTIME 'Scripts');$previousPath"
            $env:PYTHONHOME = $env:FREECAD_RUNTIME
            $env:SOLIDFREECAD_SMOKE_FCSTD = $example

            & $command "tests/solidfreecad_shaft_smoke.py"
            if ($LASTEXITCODE -ne 0) {
              throw "SolidFreeCAD shaft smoke test failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            $env:PATH = $previousPath
            $env:PYTHONHOME = $previousPythonHome
          }

          if (-not (Test-Path -LiteralPath $example)) {
            throw "The smoke test did not generate the example FCStd file."
          }

          "SOLIDFREECAD_EXAMPLE=$example" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Windows workbench preview
        shell: pwsh
        run: |
          ./scripts/preview-windows/Package-Workbench-Preview.ps1 `
            -RuntimeRoot $env:FREECAD_RUNTIME `
            -OutputDirectory "dist" `
            -ProductVersion $env:SOLIDFREECAD_VERSION `
            -FreeCADTag $env:FREECAD_TAG `
            -FreeCADCommit $env:FREECAD_COMMIT `
            -SolidFreeCADCommit $env:GITHUB_SHA `
            -ExampleFile $env:SOLIDFREECAD_EXAMPLE

      - name: Upload Windows workbench preview
        uses: actions/upload-artifact@v4
        with:
          name: SolidFreeCAD-${{ env.SOLIDFREECAD_VERSION }}-Windows-x64-Portable-Preview
          path: |
            dist/*.7z
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish preview summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## SolidFreeCAD Windows workbench preview

          - SolidFreeCAD version: ``$env:SOLIDFREECAD_VERSION``
          - SolidFreeCAD commit: ``$env:GITHUB_SHA``
          - Engine baseline run: ``$env:BASELINE_RUN_ID``
          - FreeCAD engine: ``$env:FREECAD_TAG`` at ``$env:FREECAD_COMMIT``
          - Workbench overlay: shared and platform-neutral
          - Main functional test: parametric stepped shaft with editable keyway
          - Ubuntu track: preserved and unchanged

          This workflow reuses the validated engine baseline, tests the new SolidFreeCAD layer and packages a Windows preview without recompiling FreeCAD.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

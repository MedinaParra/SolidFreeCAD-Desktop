name: Alpha8 source-only interface validation

on:
  push:
    branches:
      - "agent/windows-alpha8-interaction-workflow"
    paths:
      - ".github/workflows/alpha8-source-validation.yml"
      - "overlay/Mod/SolidFreeCAD/**"
      - "tests/solidfreecad_alpha8_gui_smoke.py"
      - "docs/alpha8-interaction-maturity.md"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidfreecad-alpha8-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Validate Python and source-only boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile alpha8 Python sources
        run: |
          python -m py_compile \
            overlay/Mod/SolidFreeCAD/InteractionWorkspace.py \
            overlay/Mod/SolidFreeCAD/InteractionWorkspaceCompat.py \
            overlay/Mod/SolidFreeCAD/Workbench.py \
            tests/solidfreecad_alpha8_gui_smoke.py

      - name: Verify source-only release boundary
        shell: bash
        run: |
          test -f docs/alpha8-interaction-maturity.md
          ! grep -R --line-number --include='*alpha8*' -E \
            'upload-artifact|Inno Setup|ISCC\.exe|Setup\.exe|7z a|Package-Alpha8' \
            .github overlay scripts tests docs README.md CHANGELOG.md
          echo "Alpha8 remains source-only: no portable, installer or executable packaging."

      - name: Verify workbench compatibility loader
        run: |
          grep -q 'InteractionWorkspaceCompat' overlay/Mod/SolidFreeCAD/Workbench.py
          grep -q 'ProfessionalWorkspaceCompat' overlay/Mod/SolidFreeCAD/InteractionWorkspaceCompat.py

name: Build Ubuntu prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-ubuntu.yml"
      - "scripts/**"
      - "src/Gui/SolidFreeCAD/**"
      - "tests/**"
  push:
    branches:
      - "agent/**"
    paths:
      - ".github/workflows/build-ubuntu.yml"
      - "scripts/**"
      - "src/Gui/SolidFreeCAD/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: solidfreecad-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-freecad-gui:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      SOURCE_DIR: ${{ github.workspace }}/build/freecad-source
      BUILD_DIR: ${{ github.workspace }}/build/freecad-build
      SCREENSHOT_PATH: ${{ github.workspace }}/build/artifacts/solidfreecad-modeling.png
      SKETCH_SCREENSHOT_PATH: ${{ github.workspace }}/build/artifacts/solidfreecad-sketch.png
      VERTICAL_SLICE_PATH: ${{ github.workspace }}/build/artifacts/workshop-vertical-slice.FCStd

    steps:
      - name: Check out SolidFreeCAD Desktop
        uses: actions/checkout@v4

      - name: Fetch official FreeCAD 1.1.1 source
        run: |
          git clone \
            --branch 1.1.1 \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/FreeCAD/FreeCAD.git \
            "${SOURCE_DIR}"
          test "$(git -C "${SOURCE_DIR}" describe --tags --exact-match)" = "1.1.1"

      - name: Apply SolidFreeCAD GUI overlay
        run: python3 scripts/apply-overlay.py "${SOURCE_DIR}"

      - name: Apply Ubuntu 22.04 OCCT compatibility patch
        run: python3 scripts/patch-freecad-ubuntu22.py "${SOURCE_DIR}"

      - name: Install official FreeCAD Ubuntu dependencies
        working-directory: ${{ env.SOURCE_DIR }}
        run: ./package/ubuntu/install-apt-packages.sh

      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: solidfreecad-ubuntu22-gcc-${{ hashFiles('src/Gui/SolidFreeCAD/**', 'scripts/apply-overlay.py', 'scripts/patch-freecad-ubuntu22.py') }}-${{ github.run_id }}
          restore-keys: |
            solidfreecad-ubuntu22-gcc-${{ hashFiles('src/Gui/SolidFreeCAD/**', 'scripts/apply-overlay.py', 'scripts/patch-freecad-ubuntu22.py') }}-
            solidfreecad-ubuntu22-gcc-

      - name: Configure official FreeCAD source
        run: |
          set -o pipefail
          mkdir -p "${BUILD_DIR}" build/logs build/artifacts
          cmake \
            -S "${SOURCE_DIR}" \
            -B "${BUILD_DIR}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFREECAD_USE_PCH=OFF \
            2>&1 | tee build/logs/configure.log

      - name: Build Material and GUI runtime resources
        run: |
          set -o pipefail
          cmake --build "${BUILD_DIR}" \
            --target Materials MaterialScripts MaterialToolsLib MaterialLib MaterialModelLib AppearanceLib Stylesheets_data PartScripts Show \
            --parallel 2 \
            2>&1 | tee build/logs/build-runtime-resources.log
          find "${BUILD_DIR}" \
            -path '*/Mod/Material/Resources/Materials/Standard/Default.FCMat' \
            -print -quit | grep -q .
          find "${BUILD_DIR}" \
            -path '*/Gui/Stylesheets/overlay/icons/mode.svg' \
            -print -quit | grep -q .
          test -f "${BUILD_DIR}/Mod/Part/AttachmentEditor/__init__.py"
          test -f "${BUILD_DIR}/Mod/Show/__init__.py"

      - name: Build FreeCADGui
        run: |
          set -o pipefail
          cmake --build "${BUILD_DIR}" \
            --target FreeCADGui \
            --parallel 2 \
            2>&1 | tee build/logs/build-freecad-gui.log

      - name: Build Part Design and Sketcher GUI modules
        run: |
          set -o pipefail
          cmake --build "${BUILD_DIR}" \
            --target PartDesignGui \
            --parallel 2 \
            2>&1 | tee build/logs/build-part-design-gui.log

      - name: Build FreeCAD executable
        run: |
          set -o pipefail
          cmake --build "${BUILD_DIR}" \
            --target FreeCAD \
            --parallel 2 \
            2>&1 | tee build/logs/build-freecad.log

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: solidfreecad-ubuntu22-gcc-${{ hashFiles('src/Gui/SolidFreeCAD/**', 'scripts/apply-overlay.py', 'scripts/patch-freecad-ubuntu22.py') }}-${{ github.run_id }}

      - name: Verify build products
        run: |
          test -f "${SOURCE_DIR}/SOLIDFREECAD_UBUNTU22_COMPAT_PATCHED"
          test -f "${BUILD_DIR}/lib/libFreeCADGui.so"
          test -x "${BUILD_DIR}/bin/FreeCAD"
          ldd "${BUILD_DIR}/bin/FreeCAD" | grep -q "libFreeCADGui"
          find "${BUILD_DIR}/Mod/PartDesign" -maxdepth 1 -name 'PartDesignGui*' -print -quit | grep -q .
          find "${BUILD_DIR}" -path '*/Mod/Material/Resources/Materials/Standard/Default.FCMat' -print -quit | grep -q .
          find "${BUILD_DIR}" -path '*/Gui/Stylesheets/overlay/icons/mode.svg' -print -quit | grep -q .
          test -f "${BUILD_DIR}/Mod/Part/AttachmentEditor/__init__.py"
          test -f "${BUILD_DIR}/Mod/Show/__init__.py"

      - name: Run SolidFreeCAD GUI, icon and persistence smoke test
        env:
          SOLIDFREECAD_SCREENSHOT: ${{ env.SCREENSHOT_PATH }}
          SOLIDFREECAD_SKETCH_SCREENSHOT: ${{ env.SKETCH_SCREENSHOT_PATH }}
          SOLIDFREECAD_VERTICAL_SLICE: ${{ env.VERTICAL_SLICE_PATH }}
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="${GITHUB_WORKSPACE}/build/runtime/gui"
          rm -rf "${XDG_RUNTIME_DIR}"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 700 "${XDG_RUNTIME_DIR}"
          rm -f /tmp/.X91-lock /tmp/.X11-unix/X91
          xvfb-run -n 91 -e build/logs/xvfb-gui.log \
            -s "-screen 0 1920x1080x24" timeout 120s \
            "${BUILD_DIR}/bin/FreeCAD" \
            "${GITHUB_WORKSPACE}/tests/gui_smoke.py" \
            2>&1 | tee build/logs/gui-smoke.log
          grep -q "SOLIDFREECAD_GUI_SMOKE_OK" build/logs/gui-smoke.log
          grep -q "SOLIDFREECAD_VERTICAL_SLICE_OK" build/logs/gui-smoke.log
          grep -q "custom-icons-validated" build/logs/gui-smoke.log
          test -f "${SCREENSHOT_PATH}"
          test -f "${SKETCH_SCREENSHOT_PATH}"
          test -f "${VERTICAL_SLICE_PATH}"

      - name: Print compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload build logs, screenshots and FCStd vertical slice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidfreecad-ubuntu-build-results
          path: |
            build/logs
            build/artifacts
            build/freecad-build/CMakeCache.txt
            build/freecad-build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
